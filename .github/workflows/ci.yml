name: NairaBooks Continuous Integration & Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Full Spectrum Quality & Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install Python Dependencies
        run: |
          uv sync --dev

      - name: Install Web Dependencies
        run: |
          npm --prefix web ci

      - name: Run Python Pytest Suite
        run: |
          uv run pytest -v

      - name: Run Python Code Linter (Ruff)
        run: |
          uv run ruff check src tests

      - name: Run Python Typecheck (Mypy)
        run: |
          uv run mypy src tests

      - name: Run Frontend TypeScript Check (tsc)
        run: |
          npm --prefix web run typecheck

      - name: Run Frontend Vitest Suite & A11y Audit (axe-core)
        run: |
          npm --prefix web test

      - name: Run SAST Static Security Scanner
        run: |
          uv run python scripts/run_sast_scan.py

      - name: Run Regulatory & Statutory Compliance Audit
        run: |
          uv run python scripts/compliance_check.py

      - name: Run Dependency & License Auditor
        run: |
          uv run python scripts/audit_dependencies.py

      - name: Run Antigravity Workflow Skill Coverage Verifier
        run: |
          uv run python scripts/verify_workflow.py --project .

      - name: Build Next.js Production Bundle
        run: |
          npm --prefix web run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
