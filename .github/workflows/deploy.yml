name: NairaBooks Cloud Staging & Production Deployment

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Build & Deploy Platform
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_env || 'production' }}

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install Dependencies
        run: |
          uv sync --no-dev
          npm --prefix web ci

      - name: Preflight Quality Gate Check
        run: |
          uv run python scripts/run_quality_gate.py

      - name: Build Next.js Production App
        run: |
          npm --prefix web run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deployment Health Check Verification
        run: |
          echo "[OK] Deployment build validated for environment: ${{ github.event.inputs.target_env || 'production' }}"
          echo "[OK] Statutory CAMA 2020 and Tax Act 2025 rule tables verified."
