    const PRESETS = {
      billSplit: { Q0: 0, Q1: 0, Q2: 0, Q2_SCAF: 1, Q3: 1, Q3_API: 0, Q4: 2, Q5: 0, Q6: 0, Q6_STACK: 0, Q7_AUTH: 0, Q7_AI: 1, Q7_EXTRA: 0, Q8: 0, Q9: 1, Q10: 1, Q11: 0, Q12: 1 },
      saas: { Q0: 0, Q1: 1, Q2: 0, Q2_SCAF: 1, Q3: 1, Q3_API: 0, Q4: 2, Q5: 0, Q6: 0, Q6_STACK: 0, Q7_AUTH: 2, Q7_AI: 0, Q7_EXTRA: 0, Q8: 0, Q9: 2, Q10: 1, Q11: 1, Q12: 2 },
      script: { Q0: 0, Q1: 0, Q2: 0, Q2_SCAF: 2, Q3: 0, Q4: 0, Q5: 2, Q6: 1, Q6_STACK: 2, Q7_AUTH: 0, Q7_AI: 0, Q7_EXTRA: 0, Q8: 1, Q9: 0, Q10: 0, Q11: 0, Q12: 0 },
    };

    const qMap = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
    let currentQId = "Q0";
    let answers = {}; // qId -> optionIndex
    let showAllMode = false;

    const btnBack = document.getElementById("btn-back");
    const qStepBadge = document.getElementById("q-step-badge");
    const qStage = document.getElementById("q-stage");
    const qTitle = document.getElementById("q-title");
    const qHint = document.getElementById("q-hint");
    const qOptions = document.getElementById("q-options");
    const breadcrumb = document.getElementById("breadcrumb");
    const flowGrid = document.getElementById("flow-grid");
    const loadoutSteps = document.getElementById("loadout-steps");
    const loadoutStats = document.getElementById("loadout-stats");
    const dedupToggle = document.getElementById("dedup-toggle");
    const searchBox = document.getElementById("search-box");
    const copyStatus = document.getElementById("copy-status");

    function countUniqueSkillsInOption(opt) {
      const dedup = dedupToggle.checked;
      const seen = new Set();
      opt.blocks.forEach(bid => {
        BLOCKS[bid].skills.forEach(sk => {
          if (!dedup || !REDUNDANT_DUPLICATES.has(sk)) seen.add(sk);
        });
      });
      return seen.size;
    }

    function getTraversalState() {
      const selected = [];
      const visitedQ = new Set();
      const trail = [];
      let ptr = "Q0";
      while (ptr && ptr !== "DONE" && !visitedQ.has(ptr)) {
        const ansIdx = answers[ptr];
        const q = qMap[ptr];
        if (!q || ansIdx === undefined) break;
        visitedQ.add(ptr);
        const opt = q.options[ansIdx];
        trail.push({ qId: ptr, label: opt.label });
        opt.blocks.forEach(b => selected.push({ qId: ptr, blockId: b }));
        ptr = opt.next;
      }
      return { selected, visitedQ, trail };
    }

    function getPreviousQuestionId(trail) {
      if (!trail.length) return null;
      if (currentQId === "DONE") return trail[trail.length - 1].qId;
      const idx = trail.findIndex(t => t.qId === currentQId);
      if (idx > 0) return trail[idx - 1].qId;
      if (idx === 0) return null;
      return trail[trail.length - 1].qId;
    }

    function renderQuestionBox() {
      const idx = QUESTIONS.findIndex(q => q.id === currentQId);
      const { trail } = getTraversalState();
      const prevQId = getPreviousQuestionId(trail);
      btnBack.disabled = !prevQId;

      if (currentQId === "DONE") {
        qStepBadge.textContent = "Finished";
        qStage.textContent = "All Done";
        qTitle.textContent = "Your custom workflow is ready in the right panel!";
        qHint.textContent = "Click any breadcrumb pill above or any card below to change an answer, or copy your skills on the right.";
        qOptions.innerHTML = `<button type="button" onclick="restartTree()" class="text-xs font-medium px-3.5 py-2.5 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] cursor-pointer hover:opacity-90">Start Over</button>`;
      } else {
        const q = qMap[currentQId];
        qStepBadge.textContent = `Question ${idx + 1} of ${QUESTIONS.length}`;
        qStage.textContent = q.stage;
        qTitle.textContent = q.question;
        qHint.textContent = q.hint;
        qOptions.innerHTML = "";
        q.options.forEach((opt, oIdx) => {
          const isChosen = answers[q.id] === oIdx;
          const skillCount = countUniqueSkillsInOption(opt);
          const countText = skillCount === 0 ? "Skips this step (0 skills)" : `+${skillCount} skill${skillCount === 1 ? "" : "s"}`;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `text-left rounded-xl border p-3 cursor-pointer transition-colors flex flex-col justify-between gap-2 ${
            isChosen
              ? "border-[var(--primary)] bg-[var(--primary)] text-[var(--primary-foreground)]"
              : "border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] hover:border-[var(--primary)]"
          }`;
          btn.innerHTML = `
            <div>
              <div class="text-xs font-semibold">${isChosen ? "&#10003; " : ""}${opt.label}</div>
              <div class="text-xs mt-1 ${isChosen ? "opacity-90" : "text-[var(--muted-foreground)]"}">${opt.desc}</div>
            </div>
            <div class="text-xs font-mono ${isChosen ? "opacity-90" : "text-[var(--muted-foreground)]"}">${countText}</div>
          `;
          btn.addEventListener("click", () => {
            showAllMode = false;
            answers[q.id] = oIdx;
            currentQId = opt.next;
            renderAll();
          });
          qOptions.appendChild(btn);
        });
      }

      // Breadcrumb trail along active path only
      breadcrumb.innerHTML = trail.map(({ qId, label }) =>
        `<button type="button" onclick="jumpTo('${qId}')" class="px-2 py-0.5 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-80 cursor-pointer">${qMap[qId].stage}: ${label}</button>`
      ).join(" &rarr; ") || "Pick your first answer below (or click a quick example above).";
    }

    function renderFlowGrid() {
      const query = searchBox.value.trim().toLowerCase();
      const { visitedQ } = getTraversalState();

      flowGrid.innerHTML = "";
      QUESTIONS.forEach((q, qIdx) => {
        const chosenIdx = answers[q.id];
        const isCurrent = currentQId === q.id && !showAllMode;
        const isAnswered = visitedQ.has(q.id) && chosenIdx !== undefined;
        const matchesSearch = !query ||
          q.question.toLowerCase().includes(query) ||
          q.stage.toLowerCase().includes(query) ||
          q.options.some(o =>
            o.label.toLowerCase().includes(query) ||
            o.desc.toLowerCase().includes(query) ||
            o.blocks.some(bid => BLOCKS[bid].skills.some(sk => sk.toLowerCase().includes(query)))
          );

        const card = document.createElement("div");
        card.className = `card-hover rounded-xl border border-[var(--border)] bg-[var(--card)] p-3.5 flex flex-col gap-2.5 ${
          isCurrent ? "node-active" : isAnswered ? "node-visited" : ""
        } ${!matchesSearch ? "node-dimmed" : ""}`;

        const header = document.createElement("button");
        header.type = "button";
        header.className = "text-left cursor-pointer";
        header.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs font-mono font-semibold px-2 py-0.5 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)]">#${qIdx + 1} &bull; ${q.id}</span>
            <span class="text-xs text-[var(--muted-foreground)]">${q.stage}</span>
          </div>
          <div class="text-xs font-semibold text-[var(--foreground)] mt-1.5">${q.question}</div>
        `;
        header.addEventListener("click", () => jumpTo(q.id));
        card.appendChild(header);

        // Branches inside this decision card
        const branchesEl = document.createElement("div");
        branchesEl.className = "space-y-2 border-t border-[var(--border)] pt-2";

        q.options.forEach((opt, oIdx) => {
          const isBranchSelected = showAllMode || (isAnswered && chosenIdx === oIdx);
          const row = document.createElement("div");
          row.className = `rounded-lg border p-2 ${
            isBranchSelected
              ? "border-[var(--primary)] bg-[var(--background)]"
              : "border-[var(--border)] bg-[var(--background)] opacity-60"
          }`;

          const branchBtn = document.createElement("button");
          branchBtn.type = "button";
          branchBtn.className = "w-full text-left cursor-pointer";
          branchBtn.innerHTML = `
            <div class="flex items-center justify-between gap-2 text-xs font-medium text-[var(--foreground)]">
              <span>${opt.label}</span>
              <span class="font-mono text-[var(--muted-foreground)] shrink-0">&rarr; ${opt.next}</span>
            </div>
            <div class="text-xs text-[var(--muted-foreground)] mt-0.5">${opt.desc}</div>
          `;
          branchBtn.addEventListener("click", () => {
            showAllMode = false;
            answers[q.id] = oIdx;
            currentQId = opt.next;
            renderAll();
          });
          row.appendChild(branchBtn);

          if (opt.blocks.length > 0) {
            const pills = document.createElement("div");
            pills.className = "flex flex-wrap gap-1 mt-1.5";
            const seenInOpt = new Set();
            opt.blocks.forEach(bid => {
              BLOCKS[bid].skills.forEach(sk => {
                if (seenInOpt.has(sk)) return;
                seenInOpt.add(sk);
                const hit = query && sk.toLowerCase().includes(query);
                const span = document.createElement("span");
                span.className = `text-xs px-1.5 py-0.5 rounded border ${
                  hit
                    ? "border-[var(--primary)] bg-[var(--primary)] text-[var(--primary-foreground)]"
                    : "border-[var(--border)] bg-[var(--card)] text-[var(--muted-foreground)]"
                }`;
                span.textContent = sk;
                pills.appendChild(span);
              });
            });
            row.appendChild(pills);
          }

          branchesEl.appendChild(row);
        });

        card.appendChild(branchesEl);
        flowGrid.appendChild(card);
      });
    }

    function getCompiledLoadout() {
      const dedup = dedupToggle.checked;
      const seen = new Set();
      const groups = [];
      const { selected } = getTraversalState();

      if (showAllMode) {
        Object.entries(BLOCKS).forEach(([bid, blk]) => {
          const kept = blk.skills.filter(sk => (!dedup || !REDUNDANT_DUPLICATES.has(sk)) && !seen.has(sk));
          kept.forEach(s => seen.add(s));
          if (kept.length) groups.push({ blockId: bid, label: blk.label, skills: kept });
        });
      } else {
        selected.forEach(({ blockId }) => {
          const blk = BLOCKS[blockId];
          const kept = blk.skills.filter(sk => (!dedup || !REDUNDANT_DUPLICATES.has(sk)) && !seen.has(sk));
          kept.forEach(s => seen.add(s));
          if (kept.length) groups.push({ blockId, label: blk.label, skills: kept });
        });
      }
      return { groups, total: seen.size };
    }

    function buildWizardPayload() {
      const { groups } = getCompiledLoadout();
      const { trail } = getTraversalState();
      const selectedSkills = groups.flatMap(g => g.skills);
      return {
        version: "1.0",
        generatedAt: new Date().toISOString(),
        dedupApplied: dedupToggle.checked,
        mode: showAllMode ? "all_skills" : "wizard_path",
        totalSkills: selectedSkills.length,
        selectedSkills,
        blocks: groups.map(g => ({ blockId: g.blockId, label: g.label, skills: g.skills })),
        answers: showAllMode ? [] : trail.map(t => ({
          qId: t.qId,
          stage: qMap[t.qId].stage,
          question: qMap[t.qId].question,
          chosenLabel: t.label,
        })),
      };
    }

    function renderLoadout() {
      const { groups, total } = getCompiledLoadout();
      loadoutStats.textContent = `${total} unique skill${total === 1 ? "" : "s"} in active path`;
      if (groups.length === 0) {
        loadoutSteps.innerHTML = `<div class="text-xs text-[var(--muted-foreground)]">Answer questions at the top (or click a Quick Example) to populate your skill loadout.</div>`;
        return;
      }
      loadoutSteps.innerHTML = groups.map(g => `
        <div class="rounded-lg border border-[var(--border)] bg-[var(--background)] p-2.5">
          <div class="text-xs font-semibold text-[var(--foreground)] mb-1.5">${g.label} (${g.skills.length})</div>
          <div class="flex flex-wrap gap-1">
            ${g.skills.map(s => `<code class="text-xs px-1.5 py-0.5 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)]">${s}</code>`).join("")}
          </div>
        </div>
      `).join("");
    }

    function renderAll() {
      renderQuestionBox();
      renderFlowGrid();
      renderLoadout();
    }

    async function copyTextSafely(text, okMsg) {
      try {
        await navigator.clipboard.writeText(text);
        copyStatus.textContent = okMsg;
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        copyStatus.textContent = ok ? okMsg : "Could not access clipboard in this preview.";
      }
    }

    window.jumpTo = (qId) => {
      showAllMode = false;
      currentQId = qId;
      renderAll();
    };

    window.restartTree = () => {
      showAllMode = false;
      answers = {};
      currentQId = "Q0";
      copyStatus.textContent = "";
      renderAll();
    };

    btnBack.addEventListener("click", () => {
      const { trail } = getTraversalState();
      const prev = getPreviousQuestionId(trail);
      if (prev) jumpTo(prev);
    });

    document.querySelectorAll(".preset-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.getAttribute("data-preset");
        if (!PRESETS[key]) return;
        showAllMode = false;
        answers = { ...PRESETS[key] };
        currentQId = "DONE";
        renderAll();
      });
    });

    document.getElementById("btn-reset").addEventListener("click", window.restartTree);
    document.getElementById("btn-show-all").addEventListener("click", () => {
      showAllMode = !showAllMode;
      renderAll();
    });
    dedupToggle.addEventListener("change", renderAll);
    searchBox.addEventListener("input", renderFlowGrid);

    function requireSelectedSkills() {
      const payload = buildWizardPayload();
      if (!payload.totalSkills) {
        copyStatus.textContent = "Answer questions first (or pick a Quick Example) so at least 1 skill is selected.";
        return null;
      }
      return payload;
    }

    document.getElementById("btn-download-json").addEventListener("click", () => {
      const payload = requireSelectedSkills();
      if (!payload) return;
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "wizard-selection.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      copyStatus.textContent = `Downloaded wizard-selection.json (${payload.totalSkills} skills). Drop it into your project or pass it to init-project.`;
    });

    document.getElementById("btn-copy-prompt").addEventListener("click", async () => {
      const payload = requireSelectedSkills();
      if (!payload) return;
      const promptText = [
        "Use `dynamic-workflow-architect` to generate my project's custom workflow, `.agents/skills.json`, `AGENTS.md`, `docs/WORKFLOW_PLAN.md`, `docs/SKILL_COVERAGE.md`, and stage docs using 100% of the selected wizard skills below (with context management and stage documentation enabled at every stage):",
        "",
        "```json",
        JSON.stringify(payload, null, 2),
        "```",
      ].join("\n");
      await copyTextSafely(promptText, `Copied chat setup prompt (${payload.totalSkills} skills). Paste this directly into Antigravity!`);
    });

    document.getElementById("btn-copy-skills-json").addEventListener("click", async () => {
      const payload = requireSelectedSkills();
      if (!payload) return;
      const skillsJson = {
        entries: [
          {
            path: ".agents/kit/skills",
            include_only: payload.selectedSkills,
          },
        ],
      };
      await copyTextSafely(JSON.stringify(skillsJson, null, 2), `Copied .agents/skills.json config (${payload.totalSkills} skills). Set 'path' to your kit skills folder if located elsewhere.`);
    });

    document.getElementById("btn-copy-list").addEventListener("click", async () => {
      const payload = requireSelectedSkills();
      if (!payload) return;
      await copyTextSafely(payload.selectedSkills.join("\n"), `Copied ${payload.totalSkills} skill names to clipboard.`);
    });

    document.getElementById("btn-copy-agents").addEventListener("click", async () => {
      const payload = requireSelectedSkills();
      if (!payload) return;
      const lines = [
        "# Project Skill Workflow (`AGENTS.md`)",
        "",
        `Active wizard loadout (${payload.totalSkills} skills). Ensure every skill below is tracked in \`docs/SKILL_COVERAGE.md\`:`,
        "",
        ...payload.blocks.map((g, i) => `${i + 1}. **${g.label}**: ${g.skills.map(s => "`" + s + "`").join(", ")}`),
      ];
      await copyTextSafely(lines.join("\n"), "Copied AGENTS.md workflow router to clipboard.");
    });

    renderAll();
  </script>
</body>
</html>
