# Render Blueprint Specification for NairaBooks
# 100% Free Tier Configuration (No Credit Card Required)
# Documentation: https://render.com/docs/blueprint-spec

version: "1"

services:
  # --------------------------------------------------------------------------
  # NairaBooks Web Application (Next.js 15 App Router & Server BFF)
  # Runs the full Nigerian IFRS Accounting Platform on Render's 100% Free Tier
  # --------------------------------------------------------------------------
  - type: web
    name: nairabooks
    runtime: node
    plan: free
    region: frankfurt
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: "10000"
      # Required: HMAC key for login sessions. Render generates a random value once and
      # keeps it across deploys, so users stay signed in after restarts.
      - key: NAIRABOOKS_SESSION_SECRET
        generateValue: true
      # Optional public demo: set NAIRABOOKS_DEMO_PASSWORD in the Render dashboard to
      # enable the 5 demo accounts and the "Try a demo role" drawer. Unset = no demo accounts.
      - key: NAIRABOOKS_DEMO_PASSWORD
        sync: false
      # Required for durable data: Neon Postgres connection string (sslmode=require).
      # Unset = data is written to the ephemeral disk and lost on every deploy/restart.
      - key: DATABASE_URL
        sync: false
