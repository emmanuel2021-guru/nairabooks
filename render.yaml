# Render Blueprint Specification for NairaBooks
# Deploy 1-Click Full-Stack Nigerian IFRS Accounting Platform
# Documentation: https://render.com/docs/blueprint-spec

version: "1"

services:
  # --------------------------------------------------------------------------
  # 1. NairaBooks Web App (Next.js 15 App Router Frontend & Server BFF)
  # --------------------------------------------------------------------------
  - type: web
    name: nairabooks-web
    runtime: node
    plan: starter # Can be switched to 'free' in the Render Dashboard
    region: frankfurt
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: "10000"
      - key: NAIRABOOKS_API_URL
        fromService:
          type: web
          name: nairabooks-api
          property: host

  # --------------------------------------------------------------------------
  # 2. NairaBooks API Engine (Python 3.11 Hexagonal Ledger & Statutory Core)
  # --------------------------------------------------------------------------
  - type: web
    name: nairabooks-api
    runtime: python
    plan: starter # Can be switched to 'free' in the Render Dashboard
    region: frankfurt
    rootDir: .
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run python -m nairabooks.api.http_server
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nairabooks-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  # --------------------------------------------------------------------------
  # 3. Managed PostgreSQL 16 (Statutory Double-Entry Ledger & Row-Level Security)
  # --------------------------------------------------------------------------
  - name: nairabooks-db
    databaseName: nairabooks
    user: nairabooks_user
    plan: starter # Can be switched to 'free' in the Render Dashboard
    region: frankfurt
    postgresMajorVersion: "16"
