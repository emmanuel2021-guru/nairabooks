# Render Blueprint Specification for NairaBooks
# 100% Free Tier Configuration (No Credit Card Required)
# Documentation: https://render.com/docs/blueprint-spec

version: "1"

services:
  # --------------------------------------------------------------------------
  # NairaBooks Web Application (Next.js 15 App Router & Server BFF)
  # Runs the full Nigerian IFRS Accounting Platform on Render's 100% Free Tier
  # --------------------------------------------------------------------------
  - type: web
    name: nairabooks
    runtime: node
    plan: free
    region: frankfurt
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: "10000"
